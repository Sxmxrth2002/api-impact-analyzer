openapi: 3.0.0

info:
  title: User Service API
  version: 1.0.0

paths:
  /users:
    get:
      responses:
        '200':
          description: List of users

  /users/{id}:
    get:
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string

    delete:
      responses:
        '204':
          description: User deleted